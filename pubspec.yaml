name: alzheimer_navigation_app
description: A navigation and safety app for Alzheimer's patients

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_map: ^6.1.1
  latlong2: ^0.9.1
  geolocator: ^11.0.1
  permission_handler: ^11.0.1
  http: ^1.1.0  # Add this for API calls

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true